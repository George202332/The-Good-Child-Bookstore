# Runs the site's service checks (Paystack, PayPal, Lulu, email, database) every 5 minutes.
# It only calls the secured address /api/cron/service-health on the LIVE site; that address only READS from the services.
# Needs two GitHub "repository secrets" (Settings > Secrets and variables > Actions):
#   SITE_URL     e.g. https://thegoodchildbookstore.com   (no slash at the end)
#   CRON_SECRET  the same value as the CRON_SECRET variable in Vercel (Production)
# GitHub only runs scheduled workflows from the repository's default branch (main), so this starts working once it is merged.
name: Service health check

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch: {}

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Call the health check
        env:
          SITE_URL: ${{ secrets.SITE_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "$SITE_URL" ] || [ -z "$CRON_SECRET" ]; then
            echo "SITE_URL or CRON_SECRET is not set as a repository secret."; exit 1
          fi
          code=$(curl -sS -o /tmp/out.json -w "%{http_code}" --max-time 90 -H "Authorization: Bearer $CRON_SECRET" "$SITE_URL/api/cron/service-health")
          echo "HTTP $code"
          # The reply lists service names and pass/fail only (never a key).
          cat /tmp/out.json || true
          test "$code" = "200"
