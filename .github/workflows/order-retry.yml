# Every 30 minutes, asks the LIVE site to repeat any after-payment work that failed (print job to Lulu, receipt e-mail).
# Uses the same two repository secrets as the service health check: SITE_URL and CRON_SECRET.
# GitHub only runs scheduled workflows from the default branch (main).
name: Order retry

on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch: {}

jobs:
  retry:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Call the order retry
        env:
          SITE_URL: ${{ secrets.SITE_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "$SITE_URL" ] || [ -z "$CRON_SECRET" ]; then
            echo "SITE_URL or CRON_SECRET is not set as a repository secret."; exit 1
          fi
          code=$(curl -sS -o /tmp/out.json -w "%{http_code}" --max-time 90 -H "Authorization: Bearer $CRON_SECRET" "$SITE_URL/api/cron/order-retry")
          echo "HTTP $code"
          cat /tmp/out.json || true
          test "$code" = "200"
